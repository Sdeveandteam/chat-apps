<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat E2E</title>
<style>
  body{font-family:sans-serif;background:#0b0f14;color:#e6eef5;margin:0;display:flex;height:100vh}
 .sidebar{width:280px;background:#111820;border-right:1px solid #1e2a36;padding:16px;display:flex;flex-direction:column}
 .chat{flex:1;display:flex;flex-direction:column}
 .header{padding:16px;border-bottom:1px solid #1e2a36}
 .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
 .msg{background:#1a2633;padding:8px 12px;border-radius:12px;max-width:70%}
 .msg.me{background:#2a4a73;align-self:flex-end}
 .composer{display:flex;gap:8px;padding:16px;border-top:1px solid #1e2a36}
 .composer input{flex:1;padding:10px;border-radius:8px;border:1px solid #2a3a4d;background:#0f1620;color:#fff}
 .composer button{padding:10px 16px;border:none;border-radius:8px;background:#3a7bd5;color:#fff;cursor:pointer}
 .auth{max-width:400px;margin:auto;padding:20px;background:#111820;border-radius:12px}
 .auth input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #2a3a4d;background:#0f1620;color:#fff}
 .contact{padding:10px;border-radius:8px;cursor:pointer}
 .contact:hover{background:#1a2633}
</style>
</head>
<body>

<div id="authScreen" class="auth">
  <h2>Login / Daftar</h2>
  <input id="identifier" placeholder="Username / Email / No HP" />
  <input id="password" type="password" placeholder="Password" />
  <input id="regUsername" placeholder="Username - khusus daftar" />
  <input id="regEmail" placeholder="Email - opsional" />
  <input id="regPhone" placeholder="No HP - opsional 628xxx" />
  <button onclick="login()">Login</button>
  <button onclick="register()">Daftar</button>
  <p id="authError" style="color:red"></p>
</div>

<div id="appScreen" style="display:none;width:100%;display:flex">
  <div class="sidebar">
    <h3>Kontak</h3>
    <input id="searchUser" placeholder="Cari username..." />
    <button onclick="addContact()">Tambah</button>
    <div id="contactList"></div>
  </div>
  <div class="chat">
    <div class="header" id="chatHeader">Pilih kontak</div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="msgInput" placeholder="Tulis pesan..." />
      <button onclick="sendMsg()">Kirim</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// Logic E2E, socket, fetch API taruh di sini
// Nanti kita isi bareng kalau mau. Ini kerangka dulu biar bisa daftar
let token = localStorage.getItem('token');
let socket;

async function register(){
  const body = {
    username: regUsername.value,
    password: password.value,
    email: regEmail.value,
    phone: regPhone.value,
    publicKey: 'dummy-key-' + Date.now() // nanti ganti E2E beneran
  };
  const res = await fetch('/api/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data = await res.json();
  if(res.ok){ localStorage.setItem('token', data.token); location.reload(); }
  else authError.innerText = data.error;
}

async function login(){
  const body = { identifier: identifier.value, password: password.value };
  const res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data = await res.json();
  if(res.ok){ localStorage.setItem('token', data.token); location.reload(); }
  else authError.innerText = data.error;
}

if(token){ authScreen.style.display='none'; appScreen.style.display='flex'; initSocket(); }

function initSocket(){
  socket = io({auth:{token}});
}
</script>
</body>
     </html>
